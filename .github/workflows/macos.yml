name: "macOS Builds"
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          # required for determining the build number via git describe
          fetch-depth: 0
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew install ninja pkgconf openssl@3 libvncserver librsvg
          # Qt is split into per-module formulae in recent Homebrew versions
          brew install qtbase qttools qt5compat qttranslations || brew install qt
          brew install qca
      - name: Build and package
        run: .ci/macos/build.sh $GITHUB_WORKSPACE /tmp/build-macos $GITHUB_WORKSPACE/dist
      - uses: actions/upload-artifact@v4
        with:
          name: veyon-master-${{ matrix.runner }}
          path: dist/*.pkg
          if-no-files-found: error
      - name: Test installed package
        run: bash .ci/macos/test-package.sh dist/*.pkg $RUNNER_TEMP/test-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.runner }}
          path: ${{ runner.temp }}/test-artifacts
          if-no-files-found: ignore
